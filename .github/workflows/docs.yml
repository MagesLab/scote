name: Docs

# Builds the Sphinx documentation and deploys it to GitHub Pages (Settings > Pages > Source: GitHub Actions) when a
# release is published, or on manual dispatch for a given tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the package with the docs extra
        run: python -m pip install --upgrade pip && python -m pip install ".[docs]"
      - name: Sphinx build, warnings as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
