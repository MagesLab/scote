# Data sets of the preprint figures for workflows/fetch.smk: URL, archive name, size, license, archive members to extract
# (glob on the path inside the archive) and platform (selects the converter). Entries with `manual_download: true` have no
# direct link: the workflow stops with a message that points to the vendor landing page given as `url`.
delete_archives: false     # set true on small disks once extraction and conversion succeeded
min_free_frac: 0.05        # never let the data volume drop below this fraction free

datasets:
  # 10x Genomics CRC serial sections, patients P1, P2, P5 (Oliveira et al. 2025; preprint Figs. 1, 2, 4, 5, 6, S1)
